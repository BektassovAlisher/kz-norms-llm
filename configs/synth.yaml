teacher: local               # local — модель в llama-server (Qwen3-8B); big — API из .env (TEACHER_*)
n_clauses: 2000              # сколько пунктов взять из train/val-документов
val_share: 0.1               # доля пунктов из val-документов
questions_per_clause: 3
question_types: [число, можно ли, условие, разговорный]
min_passage_chars: 80        # короче — в пункте не о чем спрашивать
min_letter_share: 0.5        # меньше букв — это строки таблицы, вопросы по ним выходят мусорные
not_found_share: 0.25        # доля примеров без gold-пункта в контексте → цель not_found
context_k: 5
nf_max_rerank_ratio: 0.8     # not_found-контекст: без пунктов, которые реранкер ценит ≥ 0.8 × gold
near_dup_jaccard: 0.6        # и без почти дословных дублей gold
dedup_jaccard: 0.8           # вопросы к одному пункту с такой похожестью — дубли
max_answer_chars: 700
workers: 4                   # параллельных запросов к учителю
rpm: 10                      # не чаще N запросов в минуту (бесплатный Gemini ≈ 10–15); 0 — без лимита
teacher_params: {}           # доп. параметры запроса к API, например {reasoning_effort: low}
local_teacher_params:        # Qwen3-8B «думает» перед ответом — для синтетики выключаем
  chat_template_kwargs: {enable_thinking: false}
temperature_questions: 0.7   # разнообразие формулировок
temperature_answers: 0.0     # эталон — детерминированный
seed: 42
